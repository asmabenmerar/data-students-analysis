version: 2

sources:
  - name: raw_data
    description: >
      Données brutes du projet : inscriptions des étudiants OpenClassrooms
      et estimations de population INSEE.

    database: OPENCLASSROOMS_DB
    schema: STUDENT_ANALYSIS

    tables:
      - name: RAW_STUDENTS
        description: >
          Données importées depuis le fichier CSV. Une ligne correspond à une
          inscription d'un étudiant à un parcours Data (un même étudiant peut
          apparaître plusieurs fois s'il s'est réinscrit une autre année).

        columns:
          - name: USER_ID
            description: >
              Identifiant technique unique de l'étudiant. Attention : il n'est
              pas unique par ligne, car certains étudiants ont plusieurs inscriptions.
            data_tests:
              - not_null

          - name: PATH_CATEGORY_NAME
            description: Catégorie du parcours suivi par l'étudiant
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Data']

          - name: AGE_GROUP
            description: Classe d'âge de l'étudiant au moment du début du parcours
            data_tests:
              - not_null

          - name: GENDER
            description: >
              Genre déclaré par l'étudiant. Environ 27 % de valeurs manquantes
              (champ facultatif), volontairement sans test not_null.

          - name: REGION
            description: Région de résidence de l'étudiant
            data_tests:
              - not_null

          - name: YEAR_PATH_STARTED
            description: Année de début du parcours
            data_tests:
              - not_null

      - name: RAW_INSEE_POPULATION
        description: >
          Estimations de population INSEE au 1er janvier, par région, sexe et âge
          quinquennal, années 2022 à 2025 (fichier estim-pop-nreg-sexe-aq-1975-2026.xlsx,
          rubrique Statistiques d'insee.fr). Mis au format long : une ligne = une année,
          une région, un sexe, une tranche d'âge (2 880 lignes). Les lignes de total
          (France métropolitaine, DOM, France entière) ont été retirées.
          Données agrégées et publiques : aucune donnée personnelle (pas d'enjeu RGPD).

        columns:
          - name: YEAR
            description: Année de l'estimation (population au 1er janvier).
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [2022, 2023, 2024, 2025]

          - name: REGION
            description: >
              Région au libellé INSEE (13 régions métropolitaines dont la Corse,
              et 5 DOM détaillés). Harmonisation avec OpenClassrooms faite dans le staging.
            data_tests:
              - not_null

          - name: SEX
            description: Sexe au libellé INSEE (Hommes / Femmes).
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Hommes', 'Femmes']

          - name: AGE_GROUP
            description: Tranche d'âge quinquennale au libellé INSEE (0 à 4 ans … 95 ans et plus).
            data_tests:
              - not_null

          - name: POPULATION
            description: Nombre d'habitants.
            data_tests:
              - not_null