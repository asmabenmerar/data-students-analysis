version: 2

models:
  - name: fct_enrollments
    description: >
      Table de faits : une ligne par inscription (4 647 lignes pour 4 010 étudiants).
      Données pseudonymisées, sans identifiant direct. Le grain est (student_key, enrollment_year).
    columns:
      - name: student_key
        data_tests:
          - not_null
      - name: enrollment_year
        data_tests:
          - not_null
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['Femme','Homme','Non renseigné']

  - name: mart_profile_by_year
    description: >
      Profil des inscrits par année, au format long (dimension, modalité). Les effectifs
      inférieurs à 5 sont masqués (is_suppressed = true) : seuil RGPD.
      share_pct = part des inscriptions de l'année ; share_known_gender_pct = part parmi les genres renseignés.
    columns:
      - name: enrollment_year
        data_tests:
          - not_null
      - name: dimension
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Age','Genre','Region','Statut']
      - name: modality
        data_tests:
          - not_null
      - name: is_suppressed
        data_tests:
          - not_null