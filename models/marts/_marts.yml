# Version du format de configuration dbt
version: 2

# Documentation et tests de mes trois tables finales (marts)
models:

  # ---------------------------------------------------------------
  # TABLE 1 : fct_enrollments (table de faits, niveau inscription)
  # ---------------------------------------------------------------
  - name: fct_enrollments
    description: >
      Table de faits : une ligne par inscription (4 647 lignes pour 4 010 étudiants).
      Le grain est (student_key, enrollment_year) : un étudiant ne s'inscrit qu'une fois par an.
      Données pseudonymisées, sans identifiant direct.
      Table de travail interne, non destinée à la diffusion.
    columns:
      # Identifiant haché de l'étudiant : jamais vide
      - name: student_key
        data_tests:
          - not_null
      # Année de début du parcours : jamais vide
      - name: enrollment_year
        data_tests:
          - not_null
      # Je vérifie que le recodage du genre n'a produit que les 3 valeurs prévues
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['Femme','Homme','Non renseigné']

  # ---------------------------------------------------------------
  # TABLE 2 : mart_profile_by_year (profil des inscrits, pour la diffusion)
  # ---------------------------------------------------------------
  # Format « long » : une ligne par année, dimension et modalité
  # Je justifie ici le choix de l'indicateur demandé par la mentor :
  # comme il n'y a qu'une inscription par étudiant et par an (test de grain),
  # compter les inscriptions revient à compter les étudiants actifs de l'année
  - name: mart_profile_by_year
    description: >
      Profil des inscrits par année, au format long (dimension, modalité).
      Indicateur retenu : nombre d'inscriptions par année. Comme un étudiant ne s'inscrit
      qu'une fois par an (test assert_fct_enrollments_grain), cela correspond au nombre
      d'étudiants actifs cette année-là. Les nouveaux étudiants sont isolés dans la dimension "Statut".
      Table destinée à la diffusion. Les effectifs inférieurs à 5 sont masqués
      (is_suppressed = true). Chaque dimension est agrégée séparément, sans croisement,
      pour éviter les petits effectifs.
      share_pct = part des inscriptions de l'année ;
      share_known_gender_pct = part parmi les genres renseignés.
    columns:
      # Année : jamais vide
      - name: enrollment_year
        data_tests:
          - not_null
      # Dimension analysée : j'ai ajouté « Statut » (Nouveau / Revenant) aux trois dimensions de départ
      - name: dimension
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Age','Genre','Region','Statut']
      # Modalité (par exemple « 25-29 ans » ou « Bretagne ») : jamais vide
      - name: modality
        data_tests:
          - not_null
      # Indicateur de masquage RGPD : doit toujours être vrai ou faux, jamais vide
      - name: is_suppressed
        data_tests:
          - not_null

  # ---------------------------------------------------------------
  # TABLE 3 : mart_comparison_oc_insee (comparaison avec la population française)
  # ---------------------------------------------------------------
  # C'est la table qui répond à l'étape INSEE : je compare la part de chaque
  # modalité chez OpenClassrooms avec sa part dans la population
  # Ses limites (année de référence, population de référence, regroupements)
  # sont documentées ici, comme la mentor le demande
  - name: mart_comparison_oc_insee
    description: >
      Comparaison du profil des inscrits OpenClassrooms avec la population française
      de 20 ans ou plus (INSEE, hors Corse), par année et par dimension (Age, Genre, Region).
      Une ligne = une année, une dimension, une modalité (92 lignes : 23 modalités x 4 ans).
      Pour le genre, seuls les genres renseignés sont comparés.
      representation_index = 100 x part OC / part INSEE : 100 = même proportion que dans
      la population, au-dessus de 100 = sur-représenté, en dessous = sous-représenté.
      Limites : population INSEE au 1er janvier (provisoire pour 2024-2025) ; la population
      de référence est l'ensemble des 20 ans ou plus, pas les seules personnes en reconversion ;
      les tranches de 55 ans et plus sont regroupées des deux côtés.
      Table destinée à la diffusion ; effectifs OC inférieurs à 5 masqués.
    columns:
      # Année : jamais vide, et seulement les 4 années étudiées
      - name: year
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022, 2023, 2024, 2025]
      # Ici, pas de dimension « Statut » : l'INSEE n'a pas d'équivalent à comparer
      - name: dimension
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Age','Genre','Region']
      # Modalité comparée (tranche d'âge, genre ou région) : jamais vide
      - name: modality
        data_tests:
          - not_null
      # Part de la modalité dans la population INSEE : toujours renseignée,
      # sinon l'indice ne peut pas être calculé
      - name: insee_share_pct
        description: Part de la modalité dans la population INSEE de 20 ans ou plus.
        data_tests:
          - not_null
      # Indice de représentation : volontairement sans test not_null,
      # car il peut être vide quand l'effectif OpenClassrooms est masqué (moins de 5)
      - name: representation_index
        description: 100 x part OC / part INSEE.
      # Indicateur de masquage : jamais vide
      - name: is_suppressed
        data_tests:
          - not_null