version: 2

models:
  - name: int_enrollments
    description: >
      Inscriptions enrichies : tranche « moins de 40 ans / 40 ans et plus »
      et rang d'inscription de l'étudiant.
    columns:
      - name: age_band_40
        description: Moins de 40 ans ou 40 ans et plus.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Moins de 40 ans', '40 ans et plus']

  - name: fct_enrollments
    description: >
      Table finale. Grain : une ligne = une inscription (étudiant x année de début),
      unique par couple (student_key, enrollment_year). Pour compter des étudiants
      distincts, filtrer sur enrollment_rank = 1 (4 010 étudiants pour 4 647 inscriptions).
      Pseudonymisée, sans donnée directement identifiante.
    columns:
      - name: student_key
        description: Identifiant étudiant haché.
        data_tests:
          - not_null
      - name: enrollment_rank
        description: Numéro d'inscription de l'étudiant (1 = première).
        data_tests:
          - not_null

  - name: mart_profile_by_year
    description: >
      Répartition par année et par dimension (âge, genre, région), calculée sur les
      inscriptions. Les groupes de moins de 5 personnes sont masqués (is_suppressed = true).
      Limite : une cellule masquée peut se déduire du total de l'année.
    columns:
      - name: enrollment_year
        description: Année de début du parcours.
        data_tests:
          - not_null
      - name: dimension
        description: Dimension analysée (Age, Genre ou Region).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Age', 'Genre', 'Region']
      - name: share_pct
        description: Part en pourcentage de l'effectif de l'année (vide si groupe masqué).